# RT-DETR-L Baseline Experiment Configuration
# RecoverOps Part A

model:
  name: "RT-DETR-L"
  checkpoint: "rtdetr-l.pt" # Ultralytics official pretrained checkpoint
  architecture: "rtdetr-l"
  pretrained: true

dataset:
  name: "DocILE Invoice Field Detection"
  config_file: "data/processed/invoice_detection/dataset.yaml"
  num_classes: 5
  classes:
    0: "amount_due"
    1: "date_due"
    2: "document_id"
    3: "date_issue"
    4: "vendor_name"

training:
  epochs: 50
  image_size: 640
  batch_size: 8 # Recommended for 16GB VRAM (e.g. Kaggle T4 / P100)
  device: "0" # GPU device index or '0,1' for dual GPU
  workers: 4
  seed: 42
  patience: 15 # Early stopping patience (epochs without validation improvement)
  save: true
  val: true

optimizer:
  type: "auto" # Ultralytics framework default: AdamW with warmup
  initial_learning_rate (lr0): 0.0001 # Framework default for RT-DETR
  final_learning_rate_factor (lrf): 0.01 # Framework default
  momentum / beta1: 0.9 # Framework default
  weight_decay: 0.0001 # Framework default
  warmup_epochs: 3.0 # Framework default
  warmup_momentum: 0.8 # Framework default

loss_and_hyperparameters:
  box_loss_gain: 7.5 # Framework default for RT-DETR
  cls_loss_gain: 0.5 # Framework default for RT-DETR
  fl_gamma: 1.5 # Framework default for RT-DETR
  augmentations: "framework_defaults" # Default mosaic/flipping as defined by Ultralytics RT-DETR baseline

framework_defaults_note: >
  All loss weights, optimizer parameters, learning rate schedules, and augmentations
  are maintained at Ultralytics RT-DETR-L framework defaults for strict baseline reproducibility
  without custom hyperparameter tuning or dataset-specific loss engineering.
